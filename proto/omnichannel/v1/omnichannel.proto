syntax = "proto3";

package omnichannel.v1;

option go_package = "drayya-core/gen/omnichannel/v1;omnichannelv1";

service OmnichannelService {
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc UpdateConversationStatus(UpdateConversationStatusRequest) returns (UpdateConversationStatusResponse);
  rpc ConvertToLeadOrTask(ConvertToLeadOrTaskRequest) returns (ConvertToLeadOrTaskResponse);
  rpc SuggestAIReply(SuggestAIReplyRequest) returns (SuggestAIReplyResponse);
}

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_WHATSAPP = 1;
  CHANNEL_TYPE_INSTAGRAM = 2;
  CHANNEL_TYPE_FACEBOOK = 3;
  CHANNEL_TYPE_EMAIL = 4;
  CHANNEL_TYPE_LIVECHAT = 5;
  CHANNEL_TYPE_LINKEDIN = 6;
}

message ConversationSummary {
  string id = 1;
  ChannelType channel = 2;
  string customer_name = 3;
  string customer_identifier = 4; // Phone, IG Handle, FB PSID, Email, or LinkedIn URL
  string last_message = 5;
  string last_message_time = 6;
  int32 unread_count = 7;
  string status = 8; // OPEN, PENDING, RESOLVED
  string assigned_agent = 9;
  string business_unit = 10;
  string sentiment = 11; // POSITIVE, NEUTRAL, URGENT
  string interaction_type = 12; // "DIRECT_MESSAGE", "POST_COMMENT", "LEAD_FORM"
  string post_title_or_url = 13; // e.g. "Post: Why SaaS ERP is broken"
}

message MessageItem {
  string id = 1;
  string conversation_id = 2;
  string sender_type = 3; // CUSTOMER, AGENT, AI_BOT
  string sender_name = 4;
  string content = 5;
  string media_url = 6;
  string media_type = 7; // text, image, audio, document
  string sent_at = 8;
  string delivery_status = 9; // SENT, DELIVERED, READ, FAILED
  string interaction_type = 10; // "DIRECT_MESSAGE", "POST_COMMENT"
}

message ListConversationsRequest {
  ChannelType channel = 1;
  string status = 2;
  string business_unit = 3;
  string search_query = 4;
}

message ListConversationsResponse {
  repeated ConversationSummary conversations = 1;
  int32 total_open = 2;
  int32 total_unread = 3;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  ConversationSummary summary = 1;
  repeated MessageItem messages = 2;
  string customer_email = 3;
  string customer_phone = 4;
  int32 active_journeys_count = 5;
  int32 open_invoices_count = 6;
}

message SendMessageRequest {
  string conversation_id = 1;
  string content = 2;
  string media_url = 3;
  string media_type = 4;
  string template_name = 5; // Optional Meta template name
}

message SendMessageResponse {
  MessageItem message = 1;
  string external_message_id = 2;
}

message UpdateConversationStatusRequest {
  string conversation_id = 1;
  string status = 2; // OPEN, PENDING, RESOLVED
  string assigned_agent = 3;
}

message UpdateConversationStatusResponse {
  bool success = 1;
}

message ConvertToLeadOrTaskRequest {
  string conversation_id = 1;
  string target_type = 2; // "LEAD" or "UTMS_TASK"
  string title = 3;
  string priority = 4;
  string business_unit = 5;
}

message ConvertToLeadOrTaskResponse {
  string created_id = 1;
  string message = 2;
}

message SuggestAIReplyRequest {
  string conversation_id = 1;
}

message SuggestAIReplyResponse {
  string suggested_reply = 1;
  double confidence_score = 2;
  repeated string reference_sources = 3;
}
