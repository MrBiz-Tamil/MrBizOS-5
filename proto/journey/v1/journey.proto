syntax = "proto3";

package journey.v1;

option go_package = "drayya-core/gen/journey/v1;journeyv1";

service JourneyService {
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc StartJourney(StartJourneyRequest) returns (StartJourneyResponse);
  rpc AdvanceStage(AdvanceStageRequest) returns (AdvanceStageResponse);
  rpc GetJourneyDetails(GetJourneyDetailsRequest) returns (GetJourneyDetailsResponse);
}

message JourneyStageDef {
  string id = 1;
  string stage_name = 2;
  int32 stage_order = 3;
  string description = 4;
  bool auto_task = 5;
  string auto_task_title = 6;
  string trigger_notification_channel = 7; // WHATSAPP, EMAIL, SMS
}

message JourneyTemplateDef {
  string id = 1;
  string code = 2; // e.g. "TRAVEL_VISA", "PATIENT_SURGERY", "REAL_ESTATE_ACQUISITION"
  string name = 3;
  string business_unit = 4;
  string description = 5;
  repeated JourneyStageDef stages = 6;
}

message JourneyLogEntry {
  string id = 1;
  string from_stage = 2;
  string to_stage = 3;
  string actor_name = 4;
  string notes = 5;
  string timestamp = 6;
}

message JourneyInstanceDef {
  string id = 1;
  string template_id = 2;
  string template_name = 3;
  string business_unit = 4;
  string customer_name = 5;
  string customer_contact = 6;
  string current_stage_name = 7;
  int32 current_stage_order = 8;
  int32 total_stages = 9;
  string status = 10; // ACTIVE, COMPLETED, CANCELLED
  string created_at = 11;
  string updated_at = 12;
}

message ListTemplatesRequest {
  string business_unit = 1;
}

message ListTemplatesResponse {
  repeated JourneyTemplateDef templates = 1;
}

message CreateTemplateRequest {
  string code = 1;
  string name = 2;
  string business_unit = 3;
  string description = 4;
  repeated JourneyStageDef stages = 5;
}

message CreateTemplateResponse {
  JourneyTemplateDef template = 1;
}

message ListInstancesRequest {
  string business_unit = 1;
  string status = 2;
}

message ListInstancesResponse {
  repeated JourneyInstanceDef instances = 1;
}

message StartJourneyRequest {
  string template_id = 1;
  string customer_name = 2;
  string customer_contact = 3;
  string initial_notes = 4;
}

message StartJourneyResponse {
  JourneyInstanceDef instance = 1;
}

message AdvanceStageRequest {
  string instance_id = 1;
  string target_stage_name = 2;
  string notes = 3;
  string actor_name = 4;
}

message AdvanceStageResponse {
  JourneyInstanceDef instance = 1;
  repeated string triggered_actions = 2; // e.g. ["Sent WhatsApp template to customer", "Generated UTMS verification task"]
}

message GetJourneyDetailsRequest {
  string instance_id = 1;
}

message GetJourneyDetailsResponse {
  JourneyInstanceDef instance = 1;
  repeated JourneyStageDef all_stages = 2;
  repeated JourneyLogEntry logs = 3;
}
