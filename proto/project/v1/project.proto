syntax = "proto3";

package project.v1;

option go_package = "drayya-core/gen/project/v1;projectv1";

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  
  // UTMS: Unified Task Management System
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse);
  rpc DelegateTask(DelegateTaskRequest) returns (DelegateTaskResponse);

  // Milestones & Timesheets
  rpc ListMilestones(ListMilestonesRequest) returns (ListMilestonesResponse);
  rpc CreateMilestone(CreateMilestoneRequest) returns (CreateMilestoneResponse);
  rpc LogTimesheet(LogTimesheetRequest) returns (LogTimesheetResponse);
}

message Project {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  string business_unit = 5; // HEALTH, TRAVEL, REALESTATE, ECOMM, CONSULTING
  string client_name = 6;
  string status = 7; // PLANNING, IN_PROGRESS, ON_HOLD, COMPLETED
  double budget = 8;
  double spent = 9;
  string start_date = 10;
  string target_date = 11;
  int32 total_tasks = 12;
  int32 completed_tasks = 13;
}

message UTMSTask {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string description = 4;
  string business_unit = 5;
  string assigned_to = 6;
  string priority = 7; // LOW, MEDIUM, HIGH, URGENT
  string status = 8; // BACKLOG, TODO, IN_PROGRESS, REVIEW, DONE
  string due_date = 9;
  int32 sla_hours_remaining = 10;
  string entity_resource = 11; // invoice, patient, lead, property
  string entity_id = 12;
  double estimated_hours = 13;
  double actual_hours = 14;
}

message Milestone {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string target_date = 4;
  double invoice_trigger_amount = 5;
  string status = 6; // PENDING, ACHIEVED, INVOICED
}

message TimesheetEntry {
  string id = 1;
  string project_id = 2;
  string task_id = 3;
  string employee_name = 4;
  double hours = 5;
  string work_date = 6;
  string notes = 7;
  bool billable = 8;
}

message ListProjectsRequest {
  string business_unit = 1;
  string status = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CreateProjectRequest {
  string name = 1;
  string description = 2;
  string business_unit = 3;
  string client_name = 4;
  double budget = 5;
  string target_date = 6;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string id = 1;
}

message GetProjectResponse {
  Project project = 1;
  repeated UTMSTask tasks = 2;
  repeated Milestone milestones = 3;
}

message ListTasksRequest {
  string project_id = 1;
  string business_unit = 2;
  string status = 3;
  string assigned_to = 4;
}

message ListTasksResponse {
  repeated UTMSTask tasks = 1;
}

message CreateTaskRequest {
  string project_id = 1;
  string title = 2;
  string description = 3;
  string business_unit = 4;
  string assigned_to = 5;
  string priority = 6;
  string due_date = 7;
  string entity_resource = 8;
  string entity_id = 9;
  double estimated_hours = 10;
}

message CreateTaskResponse {
  UTMSTask task = 1;
}

message UpdateTaskStatusRequest {
  string task_id = 1;
  string status = 2;
}

message UpdateTaskStatusResponse {
  UTMSTask task = 1;
}

message DelegateTaskRequest {
  string task_id = 1;
  string target_business_unit = 2;
  string new_assignee = 3;
  string delegation_note = 4;
}

message DelegateTaskResponse {
  UTMSTask task = 1;
}

message ListMilestonesRequest {
  string project_id = 1;
}

message ListMilestonesResponse {
  repeated Milestone milestones = 1;
}

message CreateMilestoneRequest {
  string project_id = 1;
  string title = 2;
  string target_date = 3;
  double invoice_trigger_amount = 4;
}

message CreateMilestoneResponse {
  Milestone milestone = 1;
}

message LogTimesheetRequest {
  string project_id = 1;
  string task_id = 2;
  string employee_name = 3;
  double hours = 4;
  string work_date = 5;
  string notes = 6;
  bool billable = 7;
}

message LogTimesheetResponse {
  TimesheetEntry entry = 1;
}
