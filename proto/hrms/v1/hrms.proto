syntax = "proto3";

package hrms.v1;

option go_package = "drayya-core/gen/hrms/v1;hrmsv1";

service HRMSService {
  rpc ListEmployees(ListEmployeesRequest) returns (ListEmployeesResponse);
  rpc CreateEmployee(CreateEmployeeRequest) returns (CreateEmployeeResponse);
  rpc UpdateSalaryStructure(UpdateSalaryStructureRequest) returns (UpdateSalaryStructureResponse);
  rpc RunMonthlyPayroll(RunMonthlyPayrollRequest) returns (RunMonthlyPayrollResponse);
  rpc ListPayslips(ListPayslipsRequest) returns (ListPayslipsResponse);
  rpc GetPayslip(GetPayslipRequest) returns (GetPayslipResponse);
}

message SalaryStructureProto {
  string basic_salary = 1;
  string hra = 2;
  string special_allowance = 3;
  string provident_fund_deduction = 4;
  string professional_tax = 5;
  string income_tax_tds = 6;
  string net_payable = 7;
}

message EmployeeProto {
  string id = 1;
  string tenant_id = 2;
  string employee_code = 3; // EMP-XXXX
  string first_name = 4;
  string last_name = 5;
  string email = 6;
  string phone = 7;
  string department = 8;
  string designation = 9;
  string date_of_joining = 10;
  SalaryStructureProto salary_structure = 11;
  bool is_active = 12;
}

message PayslipProto {
  string id = 1;
  string tenant_id = 2;
  string payslip_number = 3;
  string employee_id = 4;
  string employee_name = 5;
  string month_year = 6; // YYYY-MM
  int32 working_days = 7;
  int32 days_worked = 8;
  string gross_earnings = 9;
  string total_deductions = 10;
  string net_salary_paid = 11;
  string payment_status = 12; // PENDING, DISBURSED
  string disbursed_at = 13;
}

message ListEmployeesRequest {
  string department = 1;
}

message ListEmployeesResponse {
  repeated EmployeeProto employees = 1;
}

message CreateEmployeeRequest {
  string employee_code = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string department = 6;
  string designation = 7;
  string date_of_joining = 8;
  SalaryStructureProto salary_structure = 9;
}

message CreateEmployeeResponse {
  EmployeeProto employee = 1;
}

message UpdateSalaryStructureRequest {
  string employee_id = 1;
  SalaryStructureProto salary_structure = 2;
}

message UpdateSalaryStructureResponse {
  EmployeeProto employee = 1;
}

message RunMonthlyPayrollRequest {
  string month_year = 1; // e.g. "2026-10"
}

message RunMonthlyPayrollResponse {
  string month_year = 1;
  int32 total_employees_processed = 2;
  string total_disbursement_amount = 3;
  repeated PayslipProto generated_payslips = 4;
}

message ListPayslipsRequest {
  string month_year = 1;
  string employee_id = 2;
}

message ListPayslipsResponse {
  repeated PayslipProto payslips = 1;
}

message GetPayslipRequest {
  string id = 1;
}

message GetPayslipResponse {
  PayslipProto payslip = 1;
}
