syntax = "proto3";

package healthcare.v1;

option go_package = "drayya-core/gen/healthcare/v1;healthcarev1";

service HealthcareService {
  rpc ListDoctors(ListDoctorsRequest) returns (ListDoctorsResponse);
  rpc GetDoctor(GetDoctorRequest) returns (GetDoctorResponse);
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);
  rpc BookAppointment(BookAppointmentRequest) returns (BookAppointmentResponse);
  rpc UpdateAppointmentStatus(UpdateAppointmentStatusRequest) returns (UpdateAppointmentStatusResponse);
  rpc CreatePrescription(CreatePrescriptionRequest) returns (CreatePrescriptionResponse);
  rpc GetPatientMedicalRecord(GetPatientMedicalRecordRequest) returns (GetPatientMedicalRecordResponse);
  rpc StreamConsultationEvents(StreamConsultationEventsRequest) returns (stream ConsultationEventProto);
}

message DoctorProto {
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string name = 4;
  string specialty = 5;
  string qualification = 6;
  string registration_number = 7;
  int32 experience_years = 8;
  string consultation_fee = 9;
  bool is_available = 10;
}

message AppointmentProto {
  string id = 1;
  string tenant_id = 2;
  string doctor_id = 3;
  string doctor_name = 4;
  string patient_id = 5;
  string patient_name = 6;
  string scheduled_at = 7;
  string status = 8; // PENDING, CONFIRMED, COMPLETED, CANCELLED
  string consultation_type = 9; // IN_PERSON, VIDEO
  string room_token = 10;
  string notes = 11;
}

message PrescriptionItemProto {
  string medicine_name = 1;
  string dosage = 2;
  string frequency = 3;
  int32 duration_days = 4;
  string instructions = 5;
}

message PrescriptionProto {
  string id = 1;
  string tenant_id = 2;
  string appointment_id = 3;
  string patient_id = 4;
  string doctor_id = 5;
  string diagnosis = 6;
  repeated PrescriptionItemProto items = 7;
  string advice = 8;
  string created_at = 9;
}

message ListDoctorsRequest {
  string specialty = 1;
  bool only_available = 2;
}

message ListDoctorsResponse {
  repeated DoctorProto doctors = 1;
}

message GetDoctorRequest {
  string id = 1;
}

message GetDoctorResponse {
  DoctorProto doctor = 1;
}

message ListAppointmentsRequest {
  string doctor_id = 1;
  string patient_id = 2;
  string status = 3;
  string date = 4;
}

message ListAppointmentsResponse {
  repeated AppointmentProto appointments = 1;
}

message BookAppointmentRequest {
  string doctor_id = 1;
  string patient_name = 2;
  string patient_phone = 3;
  string scheduled_at = 4;
  string consultation_type = 5;
  string notes = 6;
}

message BookAppointmentResponse {
  AppointmentProto appointment = 1;
}

message UpdateAppointmentStatusRequest {
  string id = 1;
  string status = 2;
}

message UpdateAppointmentStatusResponse {
  AppointmentProto appointment = 1;
}

message CreatePrescriptionRequest {
  string appointment_id = 1;
  string patient_id = 2;
  string diagnosis = 3;
  repeated PrescriptionItemProto items = 4;
  string advice = 5;
}

message CreatePrescriptionResponse {
  PrescriptionProto prescription = 1;
}

message GetPatientMedicalRecordRequest {
  string patient_id = 1;
}

message GetPatientMedicalRecordResponse {
  string patient_id = 1;
  repeated PrescriptionProto prescriptions = 2;
  repeated AppointmentProto past_appointments = 3;
}

message StreamConsultationEventsRequest {
  string room_id = 1;
}

message ConsultationEventProto {
  string event_type = 1;
  string payload_json = 2;
  int64 timestamp = 3;
}
